<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Paycheck Sentinel</title>
<link rel="icon" type="image/svg+xml" sizes="any" href="{{ versioned_static('favicon.svg') }}">
<link rel="icon" type="image/x-icon" sizes="48x48" href="{{ versioned_static('favicon.ico') }}">
<link rel="apple-touch-icon" href="{{ versioned_static('apple-touch-icon.png') }}">
<meta name="theme-color" content="#0B1523">
<link rel="stylesheet" href="{{ versioned_static('style.css') }}">
<style>
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; }
  .login-card { width: 100%; max-width: 380px; background: var(--panel, #121e30); border: 1px solid var(--border, #26364d); border-radius: 12px; padding: 28px; box-sizing: border-box; }
  .login-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  .login-brand b { font-size: 18px; }
  .login-brand span { display: block; font-size: 12px; color: var(--muted, #8fa0b6); margin-top: 2px; }
  .login-card label { display: block; font-size: 12px; font-weight: 700; margin: 14px 0 6px; }
  .login-card input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid var(--border, #26364d); border-radius: 6px; background: var(--panel2, #0f1a2b); color: var(--text, #e8eef5); font-size: 14px; }
  .login-card input:focus { outline: 2px solid var(--teal, #2dd4bf); outline-offset: 0; }
  .login-card button { width: 100%; margin-top: 20px; padding: 11px 14px; font-size: 14px; cursor: pointer; }
  .login-error { margin-top: 14px; font-size: 13px; color: var(--coral, #ff7a6b); min-height: 18px; }
  .login-setup { margin-bottom: 18px; padding: 12px 14px; border: 1px solid var(--border, #26364d); border-radius: 8px; background: var(--panel2, #0f1a2b); font-size: 12px; line-height: 1.5; }
  .login-setup code { display: block; margin-top: 8px; padding: 8px 10px; border-radius: 6px; background: rgba(0,0,0,.3); font-size: 11.5px; overflow-x: auto; white-space: pre; }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-brand">
      <svg viewBox="0 0 64 64" width="40" height="40" role="img" aria-label="Paycheck Sentinel" style="flex:none">
        <defs>
          <linearGradient id="ps-login-bg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#16273F"/>
            <stop offset="1" stop-color="#0B1523"/>
          </linearGradient>
        </defs>
        <rect width="64" height="64" rx="14" fill="url(#ps-login-bg)"/>
        <rect x=".75" y=".75" width="62.5" height="62.5" rx="13.25" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="1.5"/>
        <rect x="17" y="12" width="36" height="30" rx="15" fill="#DCE6F2"/>
        <rect x="27.5" y="22" width="16" height="10" rx="5" fill="#F5B83D"/>
        <rect x="12" y="12" width="9" height="40" rx="4.5" fill="#2DD4BF"/>
      </svg>
      <div><b>Paycheck Sentinel</b><span>Sign in to continue</span></div>
    </div>

    {% if no_users %}
    <div class="login-setup">
      <b>Setup required.</b> No user exists yet. On the server, create the first administrator:
      <code>docker compose exec app python -m paycheck_sentinel.auth create-admin</code>
    </div>
    {% endif %}

    <form id="loginForm" autocomplete="on">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <div class="login-error" id="loginError" role="alert" aria-live="polite"></div>
      <button type="submit" id="loginBtn">Sign in</button>
    </form>
  </div>
</div>

<script>
(function () {
  const form = document.getElementById("loginForm");
  const errorBox = document.getElementById("loginError");
  const button = document.getElementById("loginBtn");
  const next = new URLSearchParams(window.location.search).get("next") || "/";

  form.addEventListener("submit", async event => {
    event.preventDefault();
    errorBox.textContent = "";
    button.disabled = true;
    try {
      const response = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: form.username.value,
          password: form.password.value,
          next: next,
        }),
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok) {
        errorBox.textContent = result.error || "Sign-in failed.";
        form.password.value = "";
        form.password.focus();
        return;
      }
      window.location.href = result.must_change_password ? "/account?force=1" : (result.next || "/");
    } catch (err) {
      errorBox.textContent = "Cannot reach the server. Try again.";
    } finally {
      button.disabled = false;
    }
  });
})();
</script>
</body>
</html>
